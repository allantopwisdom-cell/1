name: Build VersionBridgeRH (RootHide arm64e)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build (roothide arm64e)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos path
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            SDK_STAGE="$(mktemp -d)"
            trap 'rm -rf "$SDK_STAGE"' EXIT
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
            git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
            cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          fi
          ls -1 "$THEOS/sdks"

      - name: Install dependencies
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: |
          make clean 2>/dev/null || true
          make package messages=yes DEBUG=0 FINALPACKAGE=1
          echo "=== packages ==="
          find ./packages -maxdepth 1 -name '*.deb' -type f

      - name: Inspect deb
        run: |
          set -euo pipefail
          DEB=$(find ./packages -maxdepth 1 -name '*.deb' -type f | head -1)
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VersionBridgeRH-roothide-arm64e
          path: ./packages/*.deb
          if-no-files-found: error
